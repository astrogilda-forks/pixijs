name: Test + Build (Pull Request)

on:
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{github.workflow}} - ${{github.ref}}
  cancel-in-progress: true

# Each job gets its own machine, so nothing waits on anything else. `checks`
# and `dist` can't share one: `dist` cleans lib/ while the dts check reads it.
jobs:
  checks:
    runs-on: ubuntu-latest
    # A hung step would otherwise hold the runner for GitHub's 6h default.
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Project
      uses: ./.github/actions/setup

    - name: Lint, Types, Index, Prune and DTS
      run: npm test -- lint types index prune dts

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Project
      uses: ./.github/actions/setup

    - name: Unit Tests
      run: xvfb-run --auto-servernum npm run test:unit -- --maxWorkers=50%
      env:
        NODE_ENV: production

  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Project
      uses: ./.github/actions/setup

    - name: Build
      run: npm run dist

  # Branch protection requires a check named `build`, which passes only when
  # every job above did. Without `!cancelled()` it would be skipped after a
  # failure, and a skipped check counts as passing.
  build:
    needs: [checks, unit, dist]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - name: Check Results
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
